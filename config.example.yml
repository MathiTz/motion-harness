# Motion Harness Configuration

# General Settings
workspace_path: "/Users/user/Documents/projects/motion-harness"
default_theme: "one_dark"
max_parallel_tasks: null  # Set to integer to override CPU-based auto-scaling

# Provider Configuration
# Providers with a "models" list share endpoint/api_key/type across models.
# Use provider_id/model_name to pick a specific model (e.g. ollama-cloud/gemma3:12b).
# API keys can be set here or via environment variables:
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, OLLAMA_API_KEY, PROXY_API_KEY
providers:
  default: "ollama-cloud"

  ollama-cloud:
    name: "Ollama Cloud"
    endpoint: "https://ollama.com/v1"
    api_key: null  # Set via OLLAMA_API_KEY env var
    provider_type: "cloud"
    default_model: "gemma3:12b"
    models:
      gemma3:12b:
        temperature: 0.7
        max_tokens: 4096
      deepseek-v4-flash:
        temperature: 0.7
        max_tokens: 4096
      qwen3-coder:480b:
        temperature: 0.5
        max_tokens: 8192
      nematron-3-super:
        temperature: 0.7
        max_tokens: 4096
      glm-5.2:
        temperature: 0.7
        max_tokens: 4096
      gemma4:31b:
        temperature: 0.7
        max_tokens: 4096
      qwen3.5:397b:
        temperature: 0.7
        max_tokens: 4096
      glm-5.1:
        temperature: 0.7
        max_tokens: 4096
      minimax-m2.7:
        temperature: 0.7
        max_tokens: 4096

  local-llama:
    name: "Llama 3 (Local)"
    endpoint: "http://localhost:11434"
    api_key: null
    provider_type: "local"
    options:
      model: "llama3"
      temperature: 0.6
      embed_model: "nomic-embed-text"

# Embedding configuration
# Local providers use Ollama /api/embeddings; cloud-only setups
# fall back to a deterministic hash-based vector.
embedding:
  provider: "local-llama"
  dimension: 128

# ── Optional behaviour (all keys below are optional) ─────────────────────────
# stall_timeout: 180           # fail a turn after this long without model output (0 = off)
# (per-model option: lenient_streams: true  accepts gateways that never send a stream terminator)
# fallback_providers: [ollama-cloud/deepseek-v4-flash, claude]   # switch here if the current provider fails
# hooks:                       # your commands around tool calls
#   pre_tool:                  # non-zero exit blocks the call
#     - {match: "write_file|edit_files", command: "./scripts/guard.sh", timeout: 10}
#   post_tool:
#     - {match: "write_file|edit_files", command: "ruff format ."}
# budget:                      # per-turn limits (all optional)
#   max_steps: 12
#   max_tokens: 150000
#   max_cost_usd: 0.50
#   max_seconds: 180
# sandbox: auto                # OS write sandbox for shell/Python (auto | off)
# sandbox_allow_read: []       # e.g. ["~/.aws"] to let commands read AWS credentials again
# sandbox_deny_read: []        # e.g. ["~/.ssh"] to hide more folders
# sandbox_network: allow       # deny = no network for commands
# show_diffs: true             # inline colored diffs for edits
# remember_turns_headless: false
# default_agent_mode: plan     # plan (discuss first) | build (writes/runs; risky commands still ask)
# remember_turns: true         # store substantive turns in memory for later recall
# recall_timeout: 2.0          # seconds a memory lookup may delay a turn
#
# permissions:
#   commands:                  # shell-style globs matched against the whole command
#     allow: ["git push origin feature/*"]
#     ask:   ["make deploy*"]
#     deny:  ["curl *"]
#
# mcp:
#   servers:
#     files: { command: "npx", args: ["-y", "@modelcontextprotocol/server-filesystem", "."] }
#
# Per-model options (under providers.<id>.models.<model>): timeout, max_retries,
# native_tools, vision, context_window, thinking_budget, reasoning_effort,
# embed_model, input_mtok / output_mtok (USD per million tokens, enables cost tracking). See docs/cli.md for what each does.
