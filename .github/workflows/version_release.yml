name: Version & Release

on:
  push:
    branches: [main]

concurrency:
  group: version-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    # Skip if this push is the version-bump commit itself (avoids self-trigger).
    if: "github.event.head_commit.message != 'chore(version): bump version'"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Bump version
        id: version
        run: |
          OLD=$(cat VERSION)
          NEW=$(python .github/scripts/bump_version.py "$OLD")
          echo "old=$OLD new=$NEW"
          echo "OLD=$OLD" >> "$GITHUB_ENV"
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$NEW" > VERSION

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(version): bump version to v${{ env.NEW }}"
          git push origin HEAD:main

      - name: Create tag & release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Release ${{ steps.version.outputs.tag }}

            Automated version bump from `${{ env.OLD }}` → `${{ env.NEW }}`.

            ### Changes since last release
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
