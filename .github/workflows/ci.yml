name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the oldest supported interpreter; 3.14 evaluates annotations
        # lazily, so bugs like an un-imported name in a type hint only show up
        # on the older one. Test both.
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install shells and sandbox tooling
        # Without these the installer's per-shell tests and the bubblewrap sandbox tests silently skip on Linux.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh ksh tcsh csh fish bubblewrap dash
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (syntax errors, undefined names)
        run: |
          ruff check --select E9,F63,F7,F82 main.py core memory ui tests
          python -m compileall -q main.py core memory ui

      - name: Run tests
        run: PYTHONPATH=. pytest tests/
