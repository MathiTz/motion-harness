name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the oldest supported interpreter; 3.14 evaluates annotations
        # lazily, so bugs like an un-imported name in a type hint only show up
        # on the older one. Test both.
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (syntax errors, undefined names)
        run: |
          ruff check --select E9,F63,F7,F82 main.py core memory ui tests
          python -m compileall -q main.py core memory ui

      - name: Run tests
        run: PYTHONPATH=. pytest tests/
